version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - unconvert
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # fiber's app.Test serves the response from memory, so an unclosed body
      # in a test leaks nothing. bodyclose stays enforced on production code.
      - path: _test\.go$
        linters:
          - bodyclose
          - errcheck
          - gosec
      # Test wiring, held to the same relaxed bar as the _test.go files it serves.
      # internal/testsupport/ is listed explicitly because the pkg -> internal
      # move took postgrescontainer.go out from under tests/ and silently out
      # from under this rule with it.
      - path: (^|/)(tests|internal/testsupport)/
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
